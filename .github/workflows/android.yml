name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk CelularSaudavel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CelularSaudavel-apk
          path: CelularSaudavel.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Celular Saudável — teste ${{ github.run_number }}
          body: |
            Baixe **CelularSaudavel.apk** abaixo no celular Android e toque para instalar.
            Versão de teste, assinada com chave de desenvolvimento.
          files: CelularSaudavel.apk
          make_latest: true
